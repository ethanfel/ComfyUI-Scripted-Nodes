[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-scripted-nodes"
version = "0.1.0"
description = "A local trusted-code scripted node for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools]
py-modules = ["scripted_node"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
