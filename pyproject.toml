[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-scripted-nodes"
version = "0.4.0"
description = "Scripted nodes and a live node-pack loader for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["comfyui_scripted_nodes"]
package-dir = {comfyui_scripted_nodes = "."}
include-package-data = true

[tool.setuptools.package-data]
comfyui_scripted_nodes = [
    "scripts/*.md",
    "scripts/**/*.py",
    "web/*.js",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
